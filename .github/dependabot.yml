version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /clipy_flutter
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /clipy_flutter/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
